description: Validation error (invalid ID or body)
content:
  application/json:
    schema:
      oneOf:
        - type: object
          required:
            - status
            - message
          properties:
            status:
              type: integer
              example: 400
            message:
              type: string
              example: 'Invalid ID format'
        - type: object
          required:
            - status
            - message
          properties:
            status:
              type: integer
              example: 400
            message:
              type: string
              example: 'Invalid request body'
