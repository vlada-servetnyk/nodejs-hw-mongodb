tags:
  - Contacts
summary: Update contact by id
operationId: updateContact
description: 'Update contact by id'
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      example: '680b63f190fccc9837fae76d'
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            description: 'Contact`s name'
            type: string
            example: 'John Doe'
          phoneNumber:
            description: 'Contact`s phone number'
            type: string
            example: '+380561563729'
          contactType:
            description: 'Contact`s contact type'
            type: string
            enum: ['personal', 'work', 'home']
          email:
            description: 'Contact`s email'
            type: string
            example: 'jhon@mail.com'
          isFavourite:
            description: 'Is favourite contact'
            type: boolean
            example: false
          photo:
            description: 'Contact`s photo'
            type: string
            format: binary
responses:
  '200':
    description: Update a contact by id
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully patched a contact!
            data:
              type: object
              $ref: ../../../components/schemas/contact.yaml
  '401':
    $ref: '../../../components/responses/401.yaml'
  '404':
    $ref: '../../../components/responses/404.yaml'
